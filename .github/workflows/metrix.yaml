name: metrix

on:
  workflow_dispatch:
jobs:
  metrixjob:
    strategy:
      matrix:
        node-version: [6,7,8]
    runs-on: ubuntu-22.04
    steps:
      - name: print the nodejs version
        run: node -v
      - name: install node js
        uses: actions/setup-node@v2
        with: 
          node-version: ${{ matrix.node-version }}
      - name: show node version
        run: node -v 
